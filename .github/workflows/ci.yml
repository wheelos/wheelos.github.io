name: docs
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: |
            .i18n-cache
            en
          key: docs-i18n-${{ runner.os }}-${{ hashFiles('**/*.md') }}
      - name: Generate English documentation
        if: ${{ secrets.TRANSLATION_API_KEY != '' }}
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_API_URL: ${{ vars.TRANSLATION_API_URL || 'https://api.openai.com/v1/chat/completions' }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'gpt-4o-mini' }}
        run: npm run docs:i18n
      - run: npm run docs:build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .vitepress/dist
